name: Infrastructure CD

on:
  push:
    branches: [main]
    paths:
      # CD applies terraform/app-base/ THEN terraform/app-edge/ (PRD
      # platform/0006, superseding the single terraform/app/ config from ADR
      # 0002) AND builds/deploys service images. The identity foundation in
      # terraform/ root and bootstrap/ are human-applied. Trigger on infra
      # changes to either config or the shared modules they both use,
      # service application code changes (new commit SHA -> new image ->
      # rolling deploy), function code changes (functions/** — Lambda code
      # has no separate packaging step in this pipeline: Terraform's
      # archive_file zips functions/<name>/index.js and its source_code_hash
      # drives redeploy in the app-base apply, PRD platform/0008 §5.1(c)/(h)
      # deviation — without this path, a commit touching only
      # functions/notification-worker/index.js would never trigger CD, the
      # apply would never run, and the deployed Lambda would silently keep
      # stale code while CI stayed green), and this workflow.
      - 'terraform/app-base/**'
      - 'terraform/app-edge/**'
      - 'terraform/modules/**'
      - 'services/**'
      - 'functions/**'
      - '.github/workflows/cd.yml'

permissions:
  id-token: write
  contents: read

env:
  # app-edge's terraform_remote_state read of app-base's state (PRD
  # platform/0006) needs the state bucket name as a variable, since backend
  # blocks can't take variables/interpolation and the bucket name (it embeds
  # the account id) is deliberately kept out of committed files. Same bucket
  # as TF_STATE_BUCKET used for `terraform init -backend-config`. Harmless
  # for app-base steps, which don't declare this variable.
  TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}

  # Optional demo inbox for the SNS email subscription (PRD platform/0008).
  # Only terraform/app-base declares `notification_email`; if the
  # NOTIFICATION_EMAIL repo variable is unset/empty, app-base's plan is
  # written to simply not create the subscription (queue/DLQ/topic/Lambda
  # still deploy) — see docs/to-dos/set-notification-email-variable.md.
  # Harmless for app-edge steps, which don't declare this variable: Terraform
  # only warns on an undeclared TF_VAR_* env var (it errors only on an
  # undeclared -var CLI flag), same pattern as TF_VAR_state_bucket above.
  TF_VAR_notification_email: ${{ vars.NOTIFICATION_EMAIL }}

jobs:
  terraform-apply:
    name: Terraform apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC, deployer role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init (app-base)
        working-directory: terraform/app-base
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Terraform init (app-edge)
        working-directory: terraform/app-edge
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      # --- Discover services (PRD platform/0005 §3) ------------------------
      # Every services/<name> dir except the never-deployed _template maps to
      # a `module.<name>_service` (ecs-service, in app-edge/main.tf) and a
      # `module.<name>_table` (data, in app-base/main.tf) block (naming
      # convention: ECR repo + ECS service = "soa-<name>"). With zero
      # services this list is empty and every loop below no-ops.
      - name: Discover services
        run: |
          set -euo pipefail
          shopt -s nullglob
          services=""
          for dir in services/*/; do
            name=$(basename "$dir")
            [ "$name" = "_template" ] && continue
            services="$services $name"
          done
          services="$(echo "$services" | xargs)"
          echo "SERVICES=$services" >> "$GITHUB_ENV"
          echo "Discovered services: ${services:-<none>}"

      # --- First-run ECR ordering (PRD platform/0004 §9, generalized;
      #     repointed to app-edge by PRD platform/0006) --------------------
      # Each service's ECR repo is Terraform-managed
      # (module.<name>_service -> aws_ecr_repository.this, in app-edge — the
      # ecs-service module lives in the destroyable/billable half of the
      # split). On a service's very first run its repo doesn't exist yet, but
      # the ECS task definition needs a real pushed image to become healthy,
      # and the image can't be pushed before the repo exists. Apply just each
      # repo first (image_tag stays at its "bootstrap" default — fine, since
      # we're not touching the service here). On every later run this is a
      # no-op (repo already in state, 0 changes). Targeted, so it never
      # touches an already-running service's task definition/image, and
      # (being a -target apply of only the ECR resource) needs neither
      # app-base to be applied yet nor the ALB/cluster to exist.
      - name: Terraform apply (ECR repositories only)
        working-directory: terraform/app-edge
        run: |
          set -euo pipefail
          for name in $SERVICES; do
            echo "::group::ensure ECR repo for $name"
            terraform apply -auto-approve -target="module.${name}_service.aws_ecr_repository.this"
            echo "::endgroup::"
          done

      # --- Build + push every service image, tagged by commit SHA ---------
      # Never :latest. soa-deployer already has ecr:* (push/login). Registry
      # is derived from the caller account + region rather than a
      # per-service Terraform output, since the registry is the same for
      # every repo (<account>.dkr.ecr.<region>.amazonaws.com/soa-<name>).
      - name: Get AWS account ID
        id: account
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        env:
          REGISTRY: ${{ steps.account.outputs.id }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
        run: |
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} \
            | docker login --username AWS --password-stdin "$REGISTRY"

      - name: Build and push service images
        env:
          REGISTRY: ${{ steps.account.outputs.id }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
        run: |
          set -euo pipefail
          for name in $SERVICES; do
            image="$REGISTRY/soa-$name:${{ github.sha }}"
            echo "::group::build + push $image"
            docker build -t "$image" "services/$name"
            docker push "$image"
            echo "::endgroup::"
          done

      # --- Full apply, BASE then EDGE (PRD platform/0006 §3/§6) -----------
      # BASE first: network + cluster + execution role + ALB SG + every
      # service's DynamoDB table (module.<name>_table). Near-no-op except
      # when a new service's table lands. Free, permanent, never destroyed.
      - name: Terraform apply (app-base, full)
        working-directory: terraform/app-base
        run: terraform apply -auto-approve

      # EDGE second, now that BASE's outputs (vpc/subnets/cluster/execution
      # role/ALB SG) are guaranteed current for EDGE's terraform_remote_state
      # read: the shared ALB + listener, and every service's task def, now
      # pointed at the just-pushed image tag. Terraform registering a new
      # task def revision is what triggers ECS's rolling deploy — no
      # separate `aws ecs update-service` needed. With zero services this
      # just applies the ALB with no services behind it.
      - name: Terraform apply (app-edge, full)
        working-directory: terraform/app-edge
        run: terraform apply -auto-approve -var="image_tag=${{ github.sha }}"

      # --- Refresh the frontend's runtime API URL (PRD frontend/0001) -----
      # The SPA (hosted in app-base's `soa-frontend-*` bucket) never
      # hardcodes the ALB DNS — it fetches /config.json at startup. Only the
      # backend knows the current API URL (the ALB DNS churns across
      # app-edge apply/destroy cycles), so CD owns writing it here, right
      # after app-edge applies. frontend-cd.yml deploys the SPA bundle itself
      # and deliberately excludes config.json from its sync so a
      # frontend-only redeploy never clobbers the live API URL. The ALB
      # always exists after this apply (even with zero services behind it),
      # so this step is safe unconditionally.
      # Also publishes the Cognito user pool id and public app client id
      # (PRD platform/0009 §5.1(d)). Both are non-secret by design: a pool
      # id and a PUBLIC app client id (no client secret) are meant to be
      # embedded in browser code, so they ride the same runtime-config seam
      # as the API URL rather than a GitHub secret. No region key is needed
      # -- amazon-cognito-identity-js derives it from the pool id's prefix.
      # Built with printf (not a heredoc) so there's no delimiter line for
      # the YAML block scalar's indentation to interfere with.
      - name: Refresh frontend config.json with current API URL
        run: |
          set -euo pipefail
          ALB=$(terraform -chdir=terraform/app-edge output -raw alb_dns_name)
          BUCKET=$(terraform -chdir=terraform/app-base output -raw frontend_bucket_name)
          POOL=$(terraform -chdir=terraform/app-base output -raw cognito_user_pool_id)
          CLIENT=$(terraform -chdir=terraform/app-base output -raw cognito_client_id)
          printf '{"apiBaseUrl":"http://%s","cognitoUserPoolId":"%s","cognitoClientId":"%s"}' \
            "$ALB" "$POOL" "$CLIENT" > config.json
          aws s3 cp config.json "s3://$BUCKET/config.json" \
            --content-type application/json \
            --cache-control no-cache

      # --- Wait for every service's rollout to actually go healthy --------
      # ECS brings up the new task set and health-checks it behind the ALB
      # before draining the old one; a failed health check leaves the last
      # good task definition serving and this wait times out / fails the
      # job, so a bad deploy never reports green. The cluster lives in
      # app-base (BASE owns the ECS cluster).
      - name: Wait for each ECS service to reach steady state
        run: |
          set -euo pipefail
          CLUSTER=$(terraform -chdir=terraform/app-base output -raw cluster_id)
          for name in $SERVICES; do
            echo "::group::wait for soa-$name"
            aws ecs wait services-stable --cluster "$CLUSTER" --services "soa-$name"
            echo "::endgroup::"
          done

      # --- Smoke-test the async path (SQS -> Lambda) -----------------------
      # Proves the SQS->Lambda half of the notification pipeline end to end
      # on every deploy (PRD platform/0008 §4.8): publish one synthetic
      # UserProfileCreated event and look for evidence the worker ran. The
      # email hop (SNS -> inbox) is deliberately NOT asserted here — the
      # subscription needs a one-time human confirmation click
      # (docs/to-dos/confirm-sns-subscription.md), so only the queue/worker
      # leg is provable from CD.
      #
      # Guarded: app-base only gains the `notifications_queue_url` output
      # once PRD platform/0008's Terraform has landed. Keep CD robust against
      # an app-base state that predates it (shouldn't happen once this PR
      # merges) by skipping gracefully instead of failing the deploy on a
      # missing output.
      #
      # The Lambda's name is the literal `soa-notification-worker`, not
      # derived from $SERVICES (functions aren't ECS services and aren't
      # part of that discovery loop) — it's the fixed `soa-<name>` name from
      # the service/function naming convention for this one worker.
      #
      # If soa-deployer still lacks `lambda:*`
      # (docs/to-dos/admin-apply-lambda-grant.md not yet actioned), this step
      # is never reached: the app-base apply above already failed at
      # `lambda:CreateFunction`. That fail-closed behaviour is the intended
      # proof in PRD platform/0008 §4.6, not a bug in this step.
      - name: Smoke-test the async path (SQS -> Lambda)
        run: |
          set -euo pipefail

          QURL=$(terraform -chdir=terraform/app-base output -raw notifications_queue_url 2>/dev/null || true)
          if [ -z "$QURL" ]; then
            echo "::notice::notifications_queue_url output not found (pre-platform/0008 app-base state) — skipping the async smoke test."
            exit 0
          fi

          FN=soa-notification-worker
          LOG_GROUP="/aws/lambda/$FN"

          # Captured BEFORE sending, so the log filter below only matches an
          # invocation this run's message caused, not a stale prior one.
          START_MS=$(date +%s000)

          echo "::group::send synthetic UserProfileCreated event"
          aws sqs send-message --queue-url "$QURL" --message-body '{"type":"UserProfileCreated","userId":"cd-smoke-test","email":"cd-smoke@example.invalid","displayName":"CD smoke test","occurredAt":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}'
          echo "::endgroup::"

          echo "::group::wait for a worker invocation in $LOG_GROUP"
          found=""
          for attempt in $(seq 1 12); do
            count=$(aws logs filter-log-events --log-group-name "$LOG_GROUP" --start-time "$START_MS" --query 'length(events)' --output text 2>/dev/null || echo 0)
            if [ "$count" != "0" ]; then
              found="1"
              break
            fi
            echo "no invocation yet (attempt $attempt/12)"
            [ "$attempt" -lt 12 ] && sleep 10
          done
          echo "::endgroup::"

          if [ -z "$found" ]; then
            echo "::error::No CloudWatch Logs invocation seen in $LOG_GROUP within ~2 minutes of the smoke-test send — the SQS->Lambda path is not proven working."
            exit 1
          fi

          # An invocation happening isn't proof it succeeded: START/END/REPORT
          # lines and the handler's own console.warn (skip) lines all count
          # toward the check above, so a broken sns:Publish would still pass
          # it. Re-filter the same window for the handler's exact SNS
          # publish-failure marker (functions/notification-worker/index.js:
          # `console.error('Failed to publish notification to SNS; will
          # retry', ...)`) to prove the invocation both happened AND
          # processed the synthetic event without hitting that error path.
          # The email hop (SNS -> confirmed inbox) remains unasserted — see
          # the header comment above.
          echo "::group::check for the worker's SNS publish-failure marker"
          ERROR_PATTERN="Failed to publish notification to SNS"
          error_count=$(aws logs filter-log-events --log-group-name "$LOG_GROUP" --start-time "$START_MS" --filter-pattern "\"$ERROR_PATTERN\"" --query 'length(events)' --output text 2>/dev/null || echo 0)
          echo "::endgroup::"

          if [ "$error_count" != "0" ]; then
            echo "::error::Worker logged its SNS publish-failure marker (\"$ERROR_PATTERN\") for the smoke-test invocation in $LOG_GROUP — the Lambda ran but sns:Publish is failing."
            exit 1
          fi

          echo "Async smoke test passed: worker invocation observed in $LOG_GROUP with no SNS publish-failure marker."
